<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>rmath sandbox</title>

    
<script type="module">
import init, * as bindings from '/sandbox/web-5d151951d8fe3a07.js';
const wasm = await init({ module_or_path: '/sandbox/web-5d151951d8fe3a07_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0f15;
            color: #d8dee9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: "JetBrains Mono", "Cascadia Code", "Menlo", monospace;
            font-size: 14px;
            color: #7a8aa3;
            letter-spacing: 0.05em;
            pointer-events: none;
        }
    </style>
<link rel="modulepreload" href="/sandbox/web-5d151951d8fe3a07.js" crossorigin="anonymous" integrity="sha384-9YMh02umBVQirbv8her+g+VS6zfdCahdsxTLk+rWs2a7OIFXBmtuEF990G0Y5ZL3"><link rel="preload" href="/sandbox/web-5d151951d8fe3a07_bg.wasm" crossorigin="anonymous" integrity="sha384-Tjnr7Uav5+TsQdLh3idnfW1UuEhQVLM8qSEkxgsX7f8LG58CgX9A8wALAalprSrF" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">loading rmath sandbox…</div>
    <canvas id="the_canvas_id"></canvas>

    <script>
        // Remove the loading text once the canvas has had a chance to draw.
        const observer = new MutationObserver(() => {
            const c = document.getElementById('the_canvas_id');
            if (c && c.width > 0) {
                const l = document.getElementById('loading');
                if (l) l.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true, attributes: true });
    </script>
</body>
</html>
