<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linear Systems — Interactive Numerical Analysis</title>
    <meta
      name="description"
      content="Interactive bilingual (EN/HU) lessons on direct methods for linear systems: Gaussian elimination, pivoting, Gauss–Jordan, tridiagonal solvers, matrix inversion and determinants."
    />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('ls-theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('ls-lang') || 'en';
          document.documentElement.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
