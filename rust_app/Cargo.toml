[workspace]
resolver = "2"
members = [
    "crates/numerics",
    "crates/engine",
    "crates/cli",
    "crates/web",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
numerics = { path = "crates/numerics" }
engine = { path = "crates/engine" }
thiserror = "1.0"
