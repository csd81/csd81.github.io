[package]
name = "web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser/native UI for the matrix language, powered by egui."

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "native"

[dependencies]
engine.workspace = true
numerics.workspace = true
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_plot = "0.29"
log = "0.4"

# Browser-only deps
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Window"] }

# Native-only deps
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
