<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>rmath sandbox</title>

    <link data-trunk rel="rust" data-type="main" data-wasm-opt="z" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0f15;
            color: #d8dee9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: "JetBrains Mono", "Cascadia Code", "Menlo", monospace;
            font-size: 14px;
            color: #7a8aa3;
            letter-spacing: 0.05em;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">loading rmath sandbox…</div>
    <canvas id="the_canvas_id"></canvas>

    <script>
        // Remove the loading text once the canvas has had a chance to draw.
        const observer = new MutationObserver(() => {
            const c = document.getElementById('the_canvas_id');
            if (c && c.width > 0) {
                const l = document.getElementById('loading');
                if (l) l.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true, attributes: true });
    </script>
</body>
</html>
